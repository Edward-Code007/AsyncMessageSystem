name: .Net
on: 
    push: 
        branches:
            - main
jobs:
    Test:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v6
        - name: Setup dotnet
          uses: actions/setup-dotnet@v5
          with:
            dotnet-version: 10.0.x
        - run: dotnet test --project ./AsyncMessage.Test/AsyncMessage.test.csproj

        
                


