name: .Net
on: 
    workflow_dispatch:
    
jobs:
    Build_and_Test:
        runs-on: ubuntu-latest
        steps:
        - name: CheckOut Repo
          uses: actions/checkout@v6
        - name: Setup dotnet
          uses: actions/setup-dotnet@v5
          with:
            dotnet-version: 10.0.x
        - name: Run_Test
          run: dotnet test --project ./AsyncMessage.Test/AsyncMessage.test.csproj


        
                


